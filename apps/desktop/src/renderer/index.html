<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codey</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar">
        <div class="brand" aria-label="Codey Neovim client">
          <span class="brand-mark" aria-hidden="true">C</span>
          <div>
            <h1>Codey</h1>
            <p>Neovim, at a distance</p>
          </div>
        </div>

        <form id="connection-form" class="connection-form" autocomplete="off">
          <label>
            <span>Host</span>
            <input
              id="host"
              name="host"
              type="text"
              value="127.0.0.1"
              maxlength="253"
              spellcheck="false"
              required
            />
          </label>
          <label class="port-field">
            <span>Port</span>
            <input
              id="port"
              name="port"
              type="number"
              value="6666"
              min="1"
              max="65535"
              inputmode="numeric"
              required
            />
          </label>
          <button id="connection-button" type="submit">Connect</button>
        </form>

        <div id="status" class="status" data-phase="disconnected" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-label">Disconnected</span>
        </div>
      </header>

      <section id="editor-frame" class="editor-frame" aria-label="Neovim editor">
        <canvas id="editor" tabindex="0"></canvas>
        <div id="empty-state" class="empty-state">
          <div class="empty-glyph" aria-hidden="true">:terminal</div>
          <h2>Connect to Neovim</h2>
          <p>Start a headless instance on your trusted LAN, then enter its address above.</p>
          <code>nvim --clean --headless --listen 192.168.1.20:6666</code>
        </div>
      </section>

      <footer class="statusline">
        <span id="mode-label">OFFLINE</span>
        <span id="dimensions-label">— × —</span>
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
