version: 1
rootMenuId: 'home'
menus:
  - id: 'home'
    label: 'Home'
    groups:
      - id: 'leading'
        buttons:
          - id: 'escape'
            label: 'Esc'
            tap:
              type: 'input'
              nvimInput: '<Esc>'
              after: 'root'
          - id: 'directory'
            label: 'Directory'
            tap:
              type: 'input'
              nvimInput: '<Esc>-'
              after: 'root'
          - id: 'command'
            label: 'Cmd'
            tap:
              type: 'menu'
              menuId: 'command'
              after: 'stay'
          - id: 'leader'
            label: 'Leader'
            tap:
              type: 'menu'
              menuId: 'leader'
              after: 'stay'
          - id: 'yank'
            label: 'Yank'
            tap:
              type: 'menu'
              menuId: 'yank'
              after: 'stay'
          - id: 'delete'
            label: 'Delete'
            tap:
              type: 'menu'
              menuId: 'delete'
              after: 'stay'
      - id: 'trailing'
        buttons:
          - id: 'motions'
            label: 'Motions'
            tap:
              type: 'menu'
              menuId: 'motions'
              after: 'stay'
          - id: 'text-objects'
            label: 'TextObjects'
            tap:
              type: 'menu'
              menuId: 'text-objects'
              after: 'stay'
          - id: 'down'
            label: '⬇'
            accessibilityLabel: 'Down'
            accessibilityHint: 'Hold for navigation options'
            tap:
              type: 'input'
              nvimInput: '<Down>'
              after: 'root'
            longPress:
              type: 'menu'
              menuId: 'down-navigation'
              after: 'stay'
          - id: 'up'
            label: '⬆'
            accessibilityLabel: 'Up'
            accessibilityHint: 'Hold for navigation options'
            tap:
              type: 'input'
              nvimInput: '<Up>'
              after: 'root'
            longPress:
              type: 'menu'
              menuId: 'up-navigation'
              after: 'stay'
          - id: 'left'
            label: '⬅'
            tap:
              type: 'input'
              nvimInput: '<Left>'
              after: 'root'
          - id: 'right'
            label: '➡'
            accessibilityLabel: 'Right'
            tap:
              type: 'input'
              nvimInput: '<Right>'
              after: 'root'
          - id: 'keyboard'
            label: 'Keyboard'
            tap:
              type: 'keyboard'
              after: 'stay'
          - id: 'enter'
            label: 'Enter'
            tap:
              type: 'input'
              nvimInput: '<CR>'
              after: 'stay'
  - id: 'command'
    label: 'Cmd'
    groups:
      - id: 'leading'
        buttons:
          - id: 'save'
            label: 'Save'
            tap:
              type: 'input'
              nvimInput: ':w<CR>'
              after: 'root'
          - id: 'save-all'
            label: 'Save All'
            tap:
              type: 'input'
              nvimInput: ':wa<CR>'
              after: 'root'
          - id: 'quit'
            label: 'Quit'
            tap:
              type: 'input'
              nvimInput: ':q<CR>'
              after: 'root'
          - id: 'force-quit'
            label: 'Force Quit'
            tap:
              type: 'input'
              nvimInput: ':q!<CR>'
              after: 'root'
      - id: 'trailing'
        buttons:
          - id: 'write-quit'
            label: 'Write and Quit'
            tap:
              type: 'input'
              nvimInput: ':wq<CR>'
              after: 'root'
          - id: 'undo'
            label: 'Undo'
            tap:
              type: 'input'
              nvimInput: 'u'
              after: 'root'
          - id: 'redo'
            label: 'Redo'
            tap:
              type: 'input'
              nvimInput: '<C-r>'
              after: 'root'
          - id: 'back'
            label: 'Back'
            tap:
              type: 'back'
              after: 'stay'
  - id: 'leader'
    label: 'Leader'
    groups:
      - id: 'leading'
        buttons:
          - id: 'search'
            label: 'Search'
            tap:
              type: 'menu'
              menuId: 'search'
              after: 'stay'
          - id: 'files'
            label: 'Files'
            tap:
              type: 'input'
              nvimInput: '<Space>sf'
              after: 'root'
          - id: 'buffers'
            label: 'Buffers'
            tap:
              type: 'input'
              nvimInput: '<Space><Space>'
              after: 'root'
          - id: 'window'
            label: 'Window'
            tap:
              type: 'menu'
              menuId: 'window'
              after: 'stay'
          - id: 'code'
            label: 'Code'
            tap:
              type: 'menu'
              menuId: 'code'
              after: 'stay'
      - id: 'trailing'
        buttons:
          - id: 'project-tree'
            label: 'Project Tree'
            tap:
              type: 'input'
              nvimInput: '<Space>e'
              after: 'root'
          - id: 'outline'
            label: 'Outline'
            tap:
              type: 'input'
              nvimInput: '<Space>o'
              after: 'root'
          - id: 'terminal'
            label: 'Terminal'
            tap:
              type: 'input'
              nvimInput: ':terminal<CR>'
              after: 'root'
          - id: 'help'
            label: 'Help'
            tap:
              type: 'input'
              nvimInput: '<Space>sh'
              after: 'root'
          - id: 'back'
            label: 'Back'
            tap:
              type: 'back'
              after: 'stay'
  - id: 'motions'
    label: 'Motions'
    groups:
      - id: 'leading'
        buttons:
          - id: 'save'
            label: 'Save'
            tap:
              type: 'input'
              nvimInput: ':w<CR>'
              after: 'root'
      - id: 'trailing'
        buttons:
          - id: 'write-quit'
            label: 'Write and Quit'
            tap:
              type: 'input'
              nvimInput: ':wq<CR>'
              after: 'root'
  - id: 'text-objects'
